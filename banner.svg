<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="GS2STF: Global Seasonal 2 Sub-seasonal Teleconnection Forecasting" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#1b4b6b"/>
      <stop offset="1" stop-color="#0e8f8a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ef476f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06d6a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#118ab2" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="1010" cy="95" r="52" fill="url(#sun)" opacity="0.95"/>
  <!-- rain clouds -->
  <g fill="#e8f1f5" opacity="0.9">
    <ellipse cx="880" cy="70" rx="46" ry="24"/>
    <ellipse cx="915" cy="58" rx="36" ry="24"/>
    <ellipse cx="850" cy="80" rx="30" ry="18"/>
  </g>
  <g stroke="#8ecae6" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="860" y1="108" x2="852" y2="128"/>
    <line x1="885" y1="108" x2="877" y2="128"/>
    <line x1="910" y1="108" x2="902" y2="128"/>
  </g>
  <!-- ocean waves -->
  <path d="M0 230 Q 100 195 200 230 T 400 230 T 600 230 T 800 230 T 1000 230 T 1200 230 V300 H0 Z" fill="url(#wave)" opacity="0.55"/>
  <path d="M0 255 Q 100 225 200 255 T 400 255 T 600 255 T 800 255 T 1000 255 T 1200 255 V300 H0 Z" fill="#073b4c" opacity="0.7"/>
  <!-- title -->
  <text x="60" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="4">GS2STF</text>
  <text x="62" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#d9f3ee">Global Seasonal 2 Sub-seasonal Teleconnection Forecasting</text>
  <text x="62" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffd166">ENSO · IOD · Atlantic  →  rain · temperature · SST  →  tercile probabilities</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
